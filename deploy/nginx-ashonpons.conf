# Public edge. certbot rewrites this file in place when TLS is issued, adding
# the listen 443 block and the redirect; keep edits idempotent.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # `_` keeps the site reachable by bare IP before DNS points here, and gives
    # certbot a block to attach the certificate to once it does.
    server_name ashonarc.xyz www.ashonarc.xyz ashonpons.xyz www.ashonpons.xyz _;

    access_log /var/log/nginx/ashonpons.access.log;
    error_log  /var/log/nginx/ashonpons.error.log;

    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    # text/html is always gzipped and listing it again is a config warning.
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 512;

    # The keeper is triggered by a local systemd timer that reaches the app port
    # directly. Nothing outside this machine has a reason to reach it, and it is
    # the only endpoint that can ever send a transaction.
    location /api/cron/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An RPC upstream having a bad day must not turn into an nginx 504 at 60s
        # while the app is still waiting on it.
        proxy_read_timeout 120s;
    }
}
