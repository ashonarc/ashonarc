# Public edge, after certificates exist. bootstrap.sh installs this file in
# place of nginx-ashonpons.conf once /etc/letsencrypt/live/ashonarc.xyz is
# present, so re-running bootstrap cannot knock the site back to plain HTTP.
#
# One certificate (lineage "ashonarc.xyz") covers ashonarc.xyz, www.ashonarc.xyz
# and the old ashonpons.xyz pair; only the bare new domain serves the site, the
# other three names 301 to it so links to the old domain keep working.
#
# Derived from what `certbot --nginx --redirect` produced, with one deliberate
# difference: certbot leaves `return 404` in the port 80 block, which redirects
# the two known hostnames to HTTPS and 404s everything else -- including plain
# http://54.250.168.250/. That fallback is worth keeping for the day DNS is the
# thing that is broken, so the block proxies instead of 404ing.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ashonarc.xyz _;

    ssl_certificate     /etc/letsencrypt/live/ashonarc.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ashonarc.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ashonpons.access.log;
    error_log  /var/log/nginx/ashonpons.error.log;

    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 512;

    # The keeper is triggered by a local systemd timer that reaches the app port
    # directly. Nothing outside this machine has a reason to reach it, and it is
    # the only endpoint that can ever send a transaction.
    location /api/cron/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ashonarc.xyz ashonpons.xyz www.ashonpons.xyz;

    ssl_certificate     /etc/letsencrypt/live/ashonarc.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ashonarc.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    return 301 https://ashonarc.xyz$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ashonarc.xyz www.ashonarc.xyz ashonpons.xyz www.ashonpons.xyz _;

    server_tokens off;

    # Anything that arrived under a real hostname belongs on HTTPS, on the
    # canonical host.
    if ($host = ashonarc.xyz)      { return 301 https://$host$request_uri; }
    if ($host = www.ashonarc.xyz)  { return 301 https://ashonarc.xyz$request_uri; }
    if ($host = ashonpons.xyz)     { return 301 https://ashonarc.xyz$request_uri; }
    if ($host = www.ashonpons.xyz) { return 301 https://ashonarc.xyz$request_uri; }

    # Everything else is the bare IP, which has no certificate to offer and so
    # is served over plain HTTP rather than redirected into a name mismatch.
    location /api/cron/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
